<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Even The Rain Feels Safe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Outfit:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#08050f; --muted:#6d6380; --pink:#f3c4dd; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Outfit,system-ui,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  canvas{display:block;height:min(86vh,calc((100vw - 32px) * 8 / 7));aspect-ratio:7/8;
    border-radius:6px;box-shadow:0 0 60px rgba(180,120,220,.10);cursor:pointer;background:var(--bg)}
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
  button{font:inherit;color:var(--pink);background:transparent;border:1px solid #3a2f4a;border-radius:999px;
    padding:6px 14px;cursor:pointer}
  button:hover{border-color:var(--pink)}
  body.drag canvas{outline:2px dashed var(--pink);outline-offset:6px}
</style>
</head>
<body>
  <canvas id="c" width="700" height="800"></canvas>
  <div class="bar">
    <span>Click to replay</span>
    <button id="pick">Use your own silhouette image</button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

<script>
(() => {
// ======================= settings (مثل الكود الأصلي) =======================
const W = 700, H = 800;
const BG = [8, 5, 15];
const QUOTE = "With You, Even The Rain Feels Safe.";
const GRADIENT = [[255,170,215],[245,175,232],[205,150,245],[165,115,225]]; // وردي أعلى -> بنفسجي أسفل
const DENSITY = 0.95;          // نسبة نقاط الشكل التي تصبح جزيئات
const STEP = 3;                // المسافة بين نقاط الشكل (px)
const LINE_THRESH = 170;       // عتبة الصورة الخاصة (الأغمق من هذا = شكل)
const ORDER_JITTER = 0.15;     // عشوائية ترتيب الرسم (من الأعلى للأسفل)
const TWINKLES_PER_FRAME = 10;
const TWINKLE_LIFE = [20, 45];
const RAIN_DROPS = 260;
// مدة كل مرحلة (ثوانٍ): ضجيج المطر -> تَكوُّن الشكل -> ثبات + النص -> ذوبان
const T = { noise: 1.6, form: 4.8, hold: 7.0, melt: 3.4 };
const FORM_SPREAD = 2.8, FLY = 1.3;

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const buf = document.createElement("canvas"); buf.width = W; buf.height = H;
const bctx = buf.getContext("2d");
const img = bctx.createImageData(W, H);
const px32 = new Uint32Array(img.data.buffer);
const BG32 = (255 << 24) | (BG[2] << 16) | (BG[1] << 8) | BG[0];
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);

// ======================= الشكل: عمود إنارة + رجل بمظلة + فتاة =======================
function drawSilhouette(g){
  g.fillStyle = g.strokeStyle = "#fff";
  g.lineCap = g.lineJoin = "round";
  const line = (w, ...pts) => { g.lineWidth = w; g.beginPath(); g.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i+1]); g.stroke(); };
  const poly = (...pts) => { g.beginPath(); g.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i+1]); g.closePath(); g.fill(); };
  const circle = (x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
  const ell = (x, y, rx, ry, a = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, a, 0, Math.PI * 2); g.fill(); };

  // --- عمود الإنارة
  poly(52,790, 124,790, 112,752, 64,752);          // القاعدة
  poly(66,756, 110,756, 100,700, 76,700);
  g.fillRect(79, 300, 18, 410);                    // العمود
  g.fillRect(72, 420, 32, 8);                      // حلقة زخرفية
  g.fillRect(74, 600, 28, 7);
  poly(66,288, 110,288, 102,306, 74,306);          // رقبة الفانوس
  poly(52,200, 124,200, 112,290, 64,290);          // جسم الفانوس
  poly(42,204, 134,204, 88,160);                   // السقف
  circle(88, 150, 7);
  line(4, 88, 150, 88, 112);                       // الرأس المدبب
  g.globalCompositeOperation = "destination-out";  // نوافذ الفانوس
  for (const x of [66, 82, 98]) poly(x,212, x+11,212, x+10,278, x+2,278);
  g.globalCompositeOperation = "source-over";

  // --- المظلة
  g.beginPath(); g.ellipse(332, 298, 122, 70, 0, Math.PI, Math.PI * 2); g.closePath(); g.fill();
  g.globalCompositeOperation = "destination-out";  // حافة متموجة
  for (let i = 0; i < 6; i++){ const x = 230 + i * 41; ell(x, 304, 22, 9); }
  g.globalCompositeOperation = "source-over";
  line(4, 332, 230, 332, 214);                     // الطرف العلوي
  line(5, 332, 290, 372, 452);                     // العصا
  g.lineWidth = 5; g.beginPath(); g.arc(364, 456, 8, 0, Math.PI * 0.9); g.stroke(); // المقبض

  // --- الرجل (يمسك العمود بيد والمظلة بالأخرى)
  circle(250, 418, 27);                            // الرأس
  ell(244, 396, 26, 14, -0.2);                     // الشعر
  g.fillRect(240, 438, 20, 22);                    // الرقبة
  poly(208,462, 294,456, 300,520, 284,610, 222,612, 214,530); // الجذع
  line(24, 216, 470, 160, 485, 100, 478);          // الذراع اليسرى نحو العمود
  circle(98, 478, 12);                             // اليد على العمود
  line(22, 288, 466, 330, 458, 368, 452);          // الذراع اليمنى نحو المظلة
  circle(368, 452, 12);
  line(32, 268, 600, 282, 690, 292, 772);          // الساق اليمنى
  ell(304, 778, 22, 9);                            // الحذاء
  line(30, 236, 600, 190, 672, 132, 704);          // الساق اليسرى مرفوعة نحو العمود
  ell(118, 708, 22, 10, -0.4);

  // --- الفتاة
  circle(482, 440, 23);                            // الرأس
  ell(474, 446, 26, 33, 0.15);                     // الشعر الطويل
  g.fillRect(474, 458, 15, 16);                    // الرقبة
  poly(458,474, 506,474, 500,530, 466,530);        // الجذع
  line(12, 462, 482, 444, 524, 438, 548);          // الذراع اليسرى
  line(12, 504, 482, 518, 524, 522, 552);          // الذراع اليمنى
  g.beginPath();                                   // الفستان
  g.moveTo(466, 526); g.lineTo(500, 526);
  g.quadraticCurveTo(540, 640, 566, 738);
  g.quadraticCurveTo(483, 752, 402, 738);
  g.quadraticCurveTo(428, 640, 466, 526);
  g.fill();
  line(9, 470, 740, 470, 780);                     // الساقان
  line(9, 498, 740, 502, 780);
  ell(466, 783, 11, 5); ell(506, 783, 11, 5);
}

function maskFromDrawing(){
  const m = document.createElement("canvas"); m.width = W; m.height = H;
  drawSilhouette(m.getContext("2d"));
  const d = m.getContext("2d").getImageData(0, 0, W, H).data;
  return (x, y) => d[(y * W + x) * 4 + 3] > 128;
}

function maskFromImage(image){
  const m = document.createElement("canvas"); m.width = W; m.height = H;
  const g = m.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  const s = Math.min(W / image.width, H / image.height) * 0.92;
  const iw = image.width * s, ih = image.height * s;
  g.drawImage(image, (W - iw) / 2, H - ih - 10, iw, ih);
  const d = g.getImageData(0, 0, W, H).data;
  const lum = new Float32Array(W * H); let mean = 0;
  for (let i = 0; i < W * H; i++){ lum[i] = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2]; mean += lum[i]; }
  mean /= W * H;
  const darkBg = mean < 128;   // صورة بخلفية داكنة -> الشكل هو الفاتح
  return (x, y) => { const v = lum[y * W + x]; return darkBg ? v > 255 - LINE_THRESH : v < LINE_THRESH; };
}

// ======================= الجزيئات =======================
let N = 0, tx, ty, cr, cg, cb, x, y, vx, vy, fx, fy, delay, prog, tw, twMax, fog;
let minY = 0, spanY = 1;

function build(inside){
  const pts = [];
  for (let yy = 0; yy < H; yy += STEP)
    for (let xx = 0; xx < W; xx += STEP)
      if (inside(xx, yy) && Math.random() < DENSITY) pts.push(xx + rand(-1, 1), yy + rand(-1, 1));
  N = pts.length / 2;
  const F = n => new Float32Array(n);
  tx = F(N); ty = F(N); cr = F(N); cg = F(N); cb = F(N); x = F(N); y = F(N);
  vx = F(N); vy = F(N); fx = F(N); fy = F(N); delay = F(N); prog = F(N); tw = F(N); twMax = F(N); fog = F(N);
  minY = H; let maxY = 0;
  for (let i = 0; i < N; i++){ ty[i] = pts[i*2+1]; minY = Math.min(minY, ty[i]); maxY = Math.max(maxY, ty[i]); }
  spanY = Math.max(1, maxY - minY);
  for (let i = 0; i < N; i++){
    tx[i] = pts[i*2];
    const t = (ty[i] - minY) / spanY * (GRADIENT.length - 1);
    const k = Math.min(GRADIENT.length - 2, Math.floor(t)), f = t - k;
    const a = GRADIENT[k], b = GRADIENT[k + 1];
    cr[i] = a[0] + (b[0] - a[0]) * f; cg[i] = a[1] + (b[1] - a[1]) * f; cb[i] = a[2] + (b[2] - a[2]) * f;
    const s = Math.min(1, Math.max(0, (ty[i] - (minY + spanY * 0.78)) / (spanY * 0.22)));
    fog[i] = s * s * 7;                         // أسفل الشكل ضبابي مثل رذاذ المطر
    x[i] = rand(W); y[i] = rand(H); vy[i] = rand(1, 4); vx[i] = 0;
  }
  setPhase("noise");
}

let phase = "noise", pt = 0, clock = 0;
function setPhase(p){
  phase = p; pt = 0;
  if (p === "form") for (let i = 0; i < N; i++){
    const o = (ty[i] - minY) / spanY;                 // DRAW_ORDER = top
    delay[i] = Math.max(0, (o + rand(-ORDER_JITTER, ORDER_JITTER)) * FORM_SPREAD);
    prog[i] = 0;
  }
  if (p === "melt") for (let i = 0; i < N; i++){
    const o = 1 - (ty[i] - minY) / spanY;             // يذوب من الأسفل أولاً
    delay[i] = Math.max(0, (o + rand(-0.2, 0.2)) * 1.6);
    vx[i] = 0; vy[i] = 0;
  }
  if (p === "noise") for (let i = 0; i < N; i++){
    vy[i] = rand(1, 4); prog[i] = 0;
  }
}

const ease = u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;

function rainStep(i, f){
  y[i] += vy[i] * f; x[i] += Math.sin(clock * 1.3 + i) * 0.15 * f;
  if (y[i] > H){ y[i] -= H; x[i] = rand(W); }
}

function update(dt){
  const f = dt * 60;
  pt += dt; clock += dt;
  if (phase === "noise"){
    for (let i = 0; i < N; i++) rainStep(i, f);
    if (pt > T.noise) setPhase("form");
  } else if (phase === "form"){
    for (let i = 0; i < N; i++){
      const u = (pt - delay[i]) / FLY;
      if (u <= 0){ rainStep(i, f); fx[i] = x[i]; fy[i] = y[i]; continue; }
      const e = ease(Math.min(1, u));
      x[i] = fx[i] + (tx[i] - fx[i]) * e;
      y[i] = fy[i] + (ty[i] - fy[i]) * e;
      prog[i] = e;
    }
    if (pt > T.form) setPhase("hold");
  } else if (phase === "hold" || phase === "melt"){
    for (let i = 0; i < N; i++){
      if (phase === "melt" && pt > delay[i]){
        vy[i] += 0.11 * f; vx[i] += rand(-0.08, 0.08) * f;
        x[i] += vx[i] * f; y[i] += vy[i] * f;
        prog[i] = Math.max(0, prog[i] - dt * 0.8);
        if (y[i] > H){ y[i] -= H; x[i] = rand(W); vy[i] = rand(1, 4); vx[i] = 0; }
        continue;
      }
      const j = 0.35 + fog[i];
      x[i] = tx[i] + Math.sin(clock * 2.1 + i * 1.7) * j;
      y[i] = ty[i] + Math.cos(clock * 1.7 + i * 2.3) * j * 0.6;
      prog[i] = 1;
    }
    if (phase === "hold" && pt > T.hold) setPhase("melt");
    else if (phase === "melt" && pt > T.melt) setPhase("noise");
  }
  // تلألؤ
  for (let k = 0; k < TWINKLES_PER_FRAME && N; k++){
    const i = (Math.random() * N) | 0;
    tw[i] = twMax[i] = rand(TWINKLE_LIFE[0], TWINKLE_LIFE[1]);
  }
  for (let i = 0; i < N; i++) if (tw[i] > 0) tw[i] = Math.max(0, tw[i] - f);
}

// ======================= مطر الخلفية + رذاذ الأرض =======================
const drops = Array.from({ length: RAIN_DROPS }, () => ({ x: rand(W), y: rand(H), v: rand(7, 13), l: rand(8, 18) }));
const splashes = [];
function updateRain(f){
  for (const d of drops){
    d.y += d.v * f; d.x -= d.v * 0.08 * f;
    const ground = 770 + (d.x * 7 % 25);
    if (d.y > ground){
      for (let k = 0; k < 3; k++) splashes.push({ x: d.x, y: ground, vx: rand(-1.4, 1.4), vy: rand(-2.4, -0.8), life: rand(14, 24) });
      d.y = rand(-60, 0); d.x = rand(W + 60);
    }
  }
  for (let i = splashes.length - 1; i >= 0; i--){
    const s = splashes[i];
    s.vy += 0.18 * f; s.x += s.vx * f; s.y += s.vy * f; s.life -= f;
    if (s.life <= 0) splashes.splice(i, 1);
  }
}

// ======================= الرسم =======================
const NOISE = [150, 140, 175];
function render(){
  px32.fill(BG32);
  for (let i = 0; i < N; i++){
    const xi = x[i] | 0, yi = y[i] | 0;
    if (xi < 0 || yi < 0 || xi >= W - 1 || yi >= H - 1) continue;
    const p = prog[i];
    let b = 0.5 + 0.5 * p;
    let r = NOISE[0] + (cr[i] - NOISE[0]) * p, g = NOISE[1] + (cg[i] - NOISE[1]) * p, bl = NOISE[2] + (cb[i] - NOISE[2]) * p;
    if (tw[i] > 0){                       // الجزيء المتلألئ يقترب من الأبيض
      const s = Math.sin(Math.PI * tw[i] / twMax[i]);
      r += (255 - r) * s; g += (255 - g) * s; bl += (255 - bl) * s; b = Math.min(1.25, b + 0.6 * s);
    }
    r = Math.min(255, r * b) | 0; g = Math.min(255, g * b) | 0; bl = Math.min(255, bl * b) | 0;
    const c = (255 << 24) | (bl << 16) | (g << 8) | r, o = yi * W + xi;
    px32[o] = c; px32[o + 1] = c; px32[o + W] = c; px32[o + W + 1] = c;
  }
  bctx.putImageData(img, 0, 0);

  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1; ctx.filter = "none";
  ctx.drawImage(buf, 0, 0);
  ctx.globalCompositeOperation = "lighter";      // توهّج ناعم
  ctx.globalAlpha = 0.45; ctx.filter = "blur(5px)";
  ctx.drawImage(buf, 0, 0);
  ctx.filter = "none";

  // المطر
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(205,190,255,0.22)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (const d of drops){ ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.l * 0.08, d.y - d.l); }
  ctx.stroke();
  ctx.fillStyle = "rgba(210,200,255,0.55)";
  for (const s of splashes) ctx.fillRect(s.x, s.y, 1.6, 1.6);

  // النص
  let a = 0;
  if (phase === "hold") a = Math.min(1, Math.max(0, (pt - 0.6) / 1.4));
  if (phase === "melt") a = Math.max(0, 1 - pt / 0.8);
  if (a > 0){
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = a;
    ctx.font = '600 36px "Dancing Script", cursive';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(255,170,215,0.8)"; ctx.shadowBlur = 16;
    ctx.fillStyle = "#f6cfe3";
    ctx.fillText(QUOTE, W / 2, 62);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); updateRain(dt * 60); render();
  requestAnimationFrame(frame);
}

// ======================= التحكم =======================
cv.addEventListener("click", () => setPhase("noise"));
const file = document.getElementById("file");
document.getElementById("pick").onclick = () => file.click();
function loadFile(f){
  if (!f || !f.type.startsWith("image/")) return;
  const im = new Image();
  im.onload = () => { build(maskFromImage(im)); URL.revokeObjectURL(im.src); };
  im.src = URL.createObjectURL(f);
}
file.onchange = () => loadFile(file.files[0]);
addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drag"); });
addEventListener("dragleave", () => document.body.classList.remove("drag"));
addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drag"); loadFile(e.dataTransfer.files[0]); });

build(maskFromDrawing());
requestAnimationFrame(frame);
window.__dbg = { setPhase, get phase(){ return phase; }, get N(){ return N; } };
})();
</script>
</body>
</html>
