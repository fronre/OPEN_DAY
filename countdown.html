<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Epic Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#f6c9d8; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:Outfit,system-ui,sans-serif;
    background:radial-gradient(circle at 50% 45%,#1a1448 0%,#0a0820 60%,#03030c 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .top{position:fixed;top:18px;left:0;right:0;text-align:center;font-size:clamp(14px,2vw,20px);letter-spacing:6px;color:#9aa0dd;text-transform:uppercase;pointer-events:none}
  .bar{position:fixed;left:0;right:0;bottom:18px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 12px;font-size:13px;color:#7a80b8;transition:opacity .4s}
  .bar.hide{opacity:0;pointer-events:none}
  input{background:rgba(10,12,40,.7);border:1px solid #3d4390;border-radius:999px;color:#fff;padding:8px 14px;font:inherit;color-scheme:dark;outline:none}
  button{font:inherit;color:var(--pink);background:rgba(10,12,40,.7);border:1px solid #3d4390;border-radius:999px;padding:8px 16px;cursor:pointer}
  button:hover,input:focus{border-color:var(--pink)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top" id="top">Opening in</div>
<div class="bar" id="bar">
  <span>Opening time:</span>
  <input id="when" type="datetime-local">
  <button id="go">Start</button>
  <button id="demo">Demo · 15 s</button>
  <button id="fs">Full screen</button>
</div>

<script>
(() => {
const N = 3200;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const top = document.getElementById("top"), bar = document.getElementById("bar"), when = document.getElementById("when");
let frozen = false;   // للاختبار فقط
let W, H, DPR, target = Date.now() + 60000, state = "count", doneAt = 0, lastText = "", P = [], FW = [], rockets = [];
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const pad = n => String(n).padStart(2, "0");

// وقت افتراضي: بعد دقيقة
function toLocalInput(ms){ const d = new Date(ms - new Date().getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); }
when.value = toLocalInput(Date.now() + 5 * 60000);

function sample(text){
  const o = document.createElement("canvas"); o.width = W; o.height = H;
  const g = o.getContext("2d");
  let fs = H * 0.5; const font = s => `800 ${s}px Outfit, "Arial Black", sans-serif`;
  g.font = font(fs);
  while (g.measureText(text).width > W * 0.84 && fs > 30){ fs *= 0.95; g.font = font(fs); }
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, W / 2, H * 0.46);
  const d = g.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4 + 3] > 140) pts.push(x, y);
  const n = pts.length / 2, idx = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, N).map(i => [pts[i * 2], pts[i * 2 + 1]]);
}
function setText(text, burst){
  if (text === lastText) return; lastText = text;
  const pts = sample(text);
  P.forEach((p, i) => {
    const t = pts[i];
    if (t){ p.tx = t[0]; p.ty = t[1]; p.on = true; } else p.on = false;
    if (burst){ const a = rand(TAU), s = rand(3, 14); p.vx += Math.cos(a) * s; p.vy += Math.sin(a) * s; }
  });
}
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  if (!W || !H) return;
  cv.width = W * DPR; cv.height = H * DPR;
  if (!P.length) for (let i = 0; i < N; i++) P.push({ x: rand(W), y: rand(H), vx: 0, vy: 0, tx: 0, ty: 0, on: false, s: rand(.6, 1.5), ph: rand(TAU) });
  lastText = ""; setText(display(), false);
}

function remaining(){ return Math.max(0, Math.ceil((target - Date.now()) / 1000)); }
function display(){
  if (state === "done") return "WELCOME";
  const s = remaining();
  if (s <= 10) return String(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

// ---- الألعاب النارية
function launch(){ rockets.push({ x: rand(W * .15, W * .85), y: H, vx: rand(-1, 1), vy: -rand(H * .018, H * .026), hue: rand(360), fuse: rand(.6, 1.1) }); }
function explode(x, y, hue){
  const n = 90 + (Math.random() * 60 | 0);
  for (let i = 0; i < n; i++){ const a = rand(TAU), s = rand(1.5, 7.5); FW.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: hue + rand(-25, 25), r: rand(1.2, 2.6) }); }
}

function frame(now){
  if (!P.length || innerWidth !== W){ resize(); if (!P.length){ requestAnimationFrame(frame); return; } }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "rgba(4,4,16,.26)"; ctx.fillRect(0, 0, W, H);   // أثر خلفي
  const rem = remaining(), t = now / 1000;
  if (state === "count" && Date.now() >= target){ state = "done"; doneAt = now; top.textContent = "Open Day"; setText("WELCOME", true); }
  else if (state === "count"){ top.textContent = rem <= 10 ? "Get ready" : "Opening in"; if (!frozen) setText(display(), true); }

  // الجزيئات
  ctx.globalCompositeOperation = "source-over";
  const done = state === "done", hueBase = done ? (t * 60) % 360 : (rem <= 10 ? 330 - rem * 6 : 255);
  for (const p of P){
    if (p.on){ p.vx += (p.tx - p.x) * .05; p.vy += (p.ty - p.y) * .05; p.vx *= .83; p.vy *= .83; }
    else { p.vx += (Math.random() - .5) * .15; p.vy += (Math.random() - .5) * .15; p.vx *= .97; p.vy *= .97; if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0; }
    p.x += p.vx; p.y += p.vy;
    const tw = .6 + .4 * Math.sin(t * 3 + p.ph);
    ctx.globalAlpha = p.on ? .7 + .3 * tw : .3;
    ctx.fillStyle = `hsl(${(hueBase + (p.x / W) * 70) % 360} 88% ${p.on ? 66 : 62}%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (p.on ? 1.35 : 1.1) * (.85 + .3 * tw), 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = "lighter";
  // الصواريخ والشرارات
  if (done && now - doneAt < 30000 && Math.random() < .06) launch();
  for (let i = rockets.length - 1; i >= 0; i--){
    const r = rockets[i]; r.x += r.vx; r.y += r.vy; r.vy += H * .00045; r.fuse -= .016;
    ctx.globalAlpha = 1; ctx.fillStyle = `hsl(${r.hue} 90% 80%)`; ctx.beginPath(); ctx.arc(r.x, r.y, 2.4, 0, TAU); ctx.fill();
    if (r.fuse <= 0 || r.vy > -1){ explode(r.x, r.y, r.hue); rockets.splice(i, 1); }
  }
  for (let i = FW.length - 1; i >= 0; i--){
    const f = FW[i]; f.x += f.vx; f.y += f.vy; f.vy += .06; f.vx *= .985; f.vy *= .985; f.life -= .012;
    if (f.life <= 0){ FW.splice(i, 1); continue; }
    ctx.globalAlpha = f.life; ctx.fillStyle = `hsl(${f.hue} 95% ${55 + f.life * 25}%)`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * f.life + .4, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

function start(ms){ target = ms; state = "count"; FW = []; rockets = []; lastText = ""; setText(display(), true); bar.classList.add("hide"); }
document.getElementById("go").onclick = () => { const v = new Date(when.value).getTime(); if (v > Date.now()) start(v); else alert("Pick a time in the future."); };
document.getElementById("demo").onclick = () => start(Date.now() + 15000);
document.getElementById("fs").onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
addEventListener("pointermove", () => { bar.classList.remove("hide"); clearTimeout(window.__h); window.__h = setTimeout(() => state === "count" && Date.now() < target && bar.classList.add("hide"), 3500); });
addEventListener("resize", resize);
(document.fonts && document.fonts.load ? document.fonts.load('800 100px Outfit') : Promise.resolve()).catch(() => {}).then(() => { resize(); requestAnimationFrame(frame); });
window.__dbg = { demo: (s) => start(Date.now() + s * 1000), get state(){ return state; }, freeze: v => frozen = v,
  settle: () => P.forEach(p => { if (p.on){ p.x = p.tx; p.y = p.ty; p.vx = p.vy = 0; } }) };
})();
</script>
</body>
</html>
