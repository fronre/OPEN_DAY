<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Name In Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#f6c9d8; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:Outfit,system-ui,sans-serif;
    background:radial-gradient(circle at 50% 40%,#171b52 0%,#0a0c26 55%,#03040d 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .top{position:fixed;top:16px;left:0;right:0;text-align:center;font-size:14px;color:#8b92c9;letter-spacing:1px;pointer-events:none}
  .ui{position:fixed;left:0;right:0;bottom:26px;display:flex;gap:10px;justify-content:center;padding:0 16px}
  input{width:min(82vw,380px);padding:13px 20px;border-radius:999px;border:1px solid #4b4f8f;
    background:rgba(10,12,40,.7);color:#fff;font:600 18px Outfit,sans-serif;text-align:center;outline:none}
  input:focus{border-color:var(--pink);box-shadow:0 0 24px rgba(246,201,216,.25)}
  button{font:inherit;color:var(--pink);background:rgba(10,12,40,.7);border:1px solid #4b4f8f;border-radius:999px;padding:0 18px;cursor:pointer}
  button:hover{border-color:var(--pink)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">Type your name &nbsp;·&nbsp; move the mouse through the stars &nbsp;·&nbsp; click for a shockwave</div>
<div class="ui">
  <input id="name" maxlength="22" placeholder="Type your name…" autocomplete="off" value="Open Day">
  <button id="save" title="Save as image">📸 Save</button>
</div>

<script>
(() => {
const N = 7000;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const input = document.getElementById("name");
let W, H, DPR, P = [], mouse = { x: -999, y: -999, down: 0 };
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);

// نجمة مضيئة جاهزة (sprite) لتسريع الرسم
const sprite = document.createElement("canvas"); sprite.width = sprite.height = 48;
{ const g = sprite.getContext("2d"), r = g.createRadialGradient(24, 24, 0, 24, 24, 24);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.25, "rgba(255,255,255,.55)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 48, 48); }
const tint = document.createElement("canvas"); tint.width = tint.height = 48;

function sample(text){
  const o = document.createElement("canvas"); o.width = W; o.height = H;
  const g = o.getContext("2d");
  let fs = Math.min(H * 0.3, W * 0.45);
  const font = s => `700 ${s}px "Dancing Script", "Segoe Script", cursive`;
  g.font = font(fs);
  while (g.measureText(text).width > W * 0.86 && fs > 24){ fs *= 0.94; g.font = font(fs); }
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, W / 2, H * 0.44);
  const d = g.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4 + 3] > 140) pts.push(x, y);
  // خلط ثم اقتطاع
  const n = pts.length / 2, idx = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, N).map(i => [pts[i * 2], pts[i * 2 + 1]]);
}

function retarget(text, burst){
  const pts = sample(text.trim() || " ");
  P.forEach((p, i) => {
    const t = pts[i];
    if (t){ p.tx = t[0] + rand(-.6, .6); p.ty = t[1] + rand(-.6, .6); p.on = true; p.hue = 300 - (t[0] / W) * 120; }
    else { p.on = false; p.hue = rand(190, 320); }
    if (burst){ const a = rand(6.283), s = rand(2, 9); p.vx += Math.cos(a) * s; p.vy += Math.sin(a) * s; }
  });
}

function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  if (!W || !H) return;                        // النافذة لم تأخذ حجمها بعد
  cv.width = W * DPR; cv.height = H * DPR;
  if (!P.length) for (let i = 0; i < N; i++) P.push({
    x: rand(W), y: rand(H), vx: 0, vy: 0, tx: 0, ty: 0, on: false, hue: 250,
    s: rand(.45, 1.25), ph: rand(6.28), sp: rand(1.2, 3.2), dx: rand(-.12, .12), dy: rand(-.12, .12) });
  retarget(input.value, false);
}

let t0 = performance.now();
function frame(now){
  if (!P.length || innerWidth !== W){ resize(); if (!P.length){ requestAnimationFrame(frame); return; } }
  const t = (now - t0) / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  const R = 120, R2 = R * R;
  for (const p of P){
    if (p.on){
      p.vx += (p.tx - p.x) * 0.045; p.vy += (p.ty - p.y) * 0.045;
    } else {                                   // نجوم حرّة تطفو
      p.vx += p.dx * 0.02; p.vy += p.dy * 0.02;
      p.vx += (Math.random() - .5) * .05; p.vy += (Math.random() - .5) * .05;
      if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
    }
    const mx = p.x - mouse.x, my = p.y - mouse.y, d2 = mx * mx + my * my;
    if (d2 < R2 && d2 > 1){ const d = Math.sqrt(d2), f = (1 - d / R) * (mouse.down ? 7 : 2.4); p.vx += mx / d * f; p.vy += my / d * f; }
    p.vx *= p.on ? 0.84 : 0.97; p.vy *= p.on ? 0.84 : 0.97;
    p.x += p.vx; p.y += p.vy;
    const tw = 0.55 + 0.45 * Math.sin(t * p.sp + p.ph);
    const a = p.on ? 0.55 + 0.45 * tw : 0.18 + 0.35 * tw;
    const size = (p.on ? 4.4 : 4.4) * p.s * (0.8 + 0.5 * tw);
    ctx.globalAlpha = a;
    ctx.fillStyle = `hsl(${p.hue} 85% ${p.on ? 80 : 72}%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.26, 0, 6.283); ctx.fill();
    if (p.s > 1.12){ ctx.globalAlpha = a * 0.35; ctx.drawImage(sprite, p.x - size * .9, p.y - size * .9, size * 1.8, size * 1.8); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

let deb;
input.addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(() => retarget(input.value, true), 120); });
addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("pointerleave", () => { mouse.x = mouse.y = -999; });
addEventListener("pointerdown", e => { if (e.target === cv){ mouse.down = 1; mouse.x = e.clientX; mouse.y = e.clientY; } });
addEventListener("pointerup", () => { mouse.down = 0; });
document.getElementById("save").onclick = () => {
  const o = document.createElement("canvas"); o.width = cv.width; o.height = cv.height;
  const g = o.getContext("2d"); g.fillStyle = "#070921"; g.fillRect(0, 0, o.width, o.height); g.drawImage(cv, 0, 0);
  const a = document.createElement("a"); a.download = "my-name-in-stars.png"; a.href = o.toDataURL("image/png"); a.click();
};
addEventListener("resize", resize);
window.__dbg = { settle: () => P.forEach(p => { if (p.on){ p.x = p.tx; p.y = p.ty; p.vx = p.vy = 0; } }) };
(document.fonts && document.fonts.load ? document.fonts.load('700 60px "Dancing Script"') : Promise.resolve())
  .catch(() => {}).then(() => { resize(); requestAnimationFrame(frame); input.focus(); input.select(); });
})();
</script>
</body>
</html>
