<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Love Heart Beat</title>
<style>
  html,body{margin:0;height:100%;background:#12040d;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:manipulation;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== settings =====
const MSG    = "You make every day brighter";
const HEADER = "~ For You ~";
const RAIN   = "01<>/\\|*+#%=-:.@";
const RAMP   = " .:-=+*#%@";
// timeline (seconds)
const T_FORM = 1.8, T_SETTLED = 5.6, T_TEXT = 6.2, T_OUT = 17, T_IGN = 18.2, T_END = 28;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, FS, CW, CH, COLS, ROWS, CX, CY, S, TFS;
let ambient = [], parts = [], outline = [], start = 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
// implicit heart: inside when <= 0
const heartF = (x, y) => { const a = x * x + y * y - 1; return a * a * a - x * x * y * y * y; };

function toHeart(r, c, k) {
  const px = c * CW + CW / 2, py = r * CH + CH / 2;
  return [(px - CX) / (S * k), -(py - CY) / (S * k) + 0.15];
}

function setup() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  FS = Math.max(9, Math.min(14, Math.floor(W / 62)));
  CW = FS * 0.62; CH = FS * 1.12;
  COLS = Math.floor(W / CW); ROWS = Math.floor(H / CH);
  CX = W / 2; CY = H * 0.42; S = Math.min(W * 0.36, H * 0.24);
  ctx.textBaseline = 'top';

  // 1) background code rain columns
  ambient = [];
  for (let c = 0; c < COLS; c++)
    if (Math.random() < 0.55)
      ambient.push({ c, spd: rnd(5, 16), ph: rnd(0, ROWS), tail: Math.floor(rnd(4, 14)) });

  // 2) particles: one per heart cell, flying in from the rain
  parts = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const [x, y] = toHeart(r, c, 1);
      if (heartF(x, y) <= 0)
        parts.push({ r, c, sr: rnd(-ROWS * 0.3, ROWS * 0.15), sc: c + rnd(-10, 10),
                     launch: rnd(T_FORM, T_SETTLED - 1.4), dur: rnd(0.7, 1.3), i: Math.floor(rnd(0, 99)) });
    }

  // 3) outline (parametric heart) written with "LOVE"
  const seen = new Set(); outline = [];
  const N = 1200;
  for (let i = 0; i < N; i++) {
    const th = i / N * Math.PI * 2;
    const hx = 16 * Math.sin(th) ** 3;
    const hy = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);
    const px = CX + hx / 16 * S * 1.25, py = CY - (hy + 2.5) / 16 * S * 1.25;
    const c = Math.floor(px / CW), r = Math.floor(py / CH), key = r * 100000 + c;
    if (seen.has(key) || r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
    seen.add(key);
    outline.push({ r, c, od: Math.min(th, 2 * Math.PI - th) / Math.PI });
  }

  // text size that fits the screen
  TFS = FS + 4;
  ctx.font = `bold ${TFS}px "Courier New",monospace`;
  while (ctx.measureText(MSG + "_").width > W * 0.9 && TFS > 9) {
    TFS--; ctx.font = `bold ${TFS}px "Courier New",monospace`;
  }
  start = 0;
}

function drawCell(r, c, k, t, alpha, beat) {
  const [x, y] = toHeart(r, c, k);
  const f = heartF(x, y);
  if (f > 0) return;
  const v = Math.pow(clamp(-f * 3), 0.4);              // 0 at edge -> 1 inside
  const light = clamp(0.5 - x * 0.35 + y * 0.3);       // light from upper-left
  const s = clamp(0.3 + 0.35 * v * light + 0.3 * v + 0.07 * Math.sin(x * 9 + y * 7 + t * 3) + 0.1 * beat);
  const ch = RAMP[1 + Math.floor(s * (RAMP.length - 2))];
  ctx.fillStyle = `rgba(255,${Math.round(80 + 110 * s)},${Math.round(140 + 70 * s)},${(0.35 + 0.65 * s) * alpha})`;
  ctx.fillText(ch, c * CW, r * CH);
}

function frame(now) {
  if (!start) start = now;
  let t = (now - start) / 1000;
  if (t > T_END) { start = now; t = 0; }

  ctx.fillStyle = '#12040d';
  ctx.fillRect(0, 0, W, H);
  ctx.font = `${FS}px "Courier New",monospace`;
  ctx.textAlign = 'left';

  // heartbeat: "lub-dub" = two gaussian pulses every 1.1s
  let beat = 0;
  if (t > T_SETTLED) {
    const bt = (t - T_SETTLED) % 1.1;
    beat = Math.max(Math.exp(-(((bt - 0.10) / 0.07) ** 2)), 0.7 * Math.exp(-(((bt - 0.32) / 0.08) ** 2)));
  }
  const kScale = 1 + 0.05 * beat;
  const fill = t < T_OUT ? 1 : clamp(1 - (t - T_OUT) / 1.2);

  // soft glow behind the heart
  if (t > T_FORM) {
    const a = (0.10 + 0.14 * beat) * clamp((t - T_FORM) / 3);
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, S * 1.7);
    g.addColorStop(0, `rgba(255,40,120,${a})`);
    g.addColorStop(1, 'rgba(255,40,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // code rain
  const dim = t < T_FORM ? 1 : 0.55;
  for (const a of ambient) {
    const head = (a.ph + a.spd * t) % (ROWS + a.tail);
    for (let k = 0; k < a.tail; k++) {
      const r = Math.floor(head) - k;
      if (r < 0 || r >= ROWS) continue;
      const br = (k === 0 ? 0.6 : 0.3 * (1 - k / a.tail)) * dim;
      ctx.fillStyle = `rgba(255,110,170,${br})`;
      ctx.fillText(RAIN[(a.c * 7 + r * 3 + Math.floor(t * 8)) % RAIN.length], a.c * CW, r * CH);
    }
  }

  // heart
  if (t < T_SETTLED) {
    for (const p of parts) {
      if (t < p.launch) continue;
      const q = clamp((t - p.launch) / p.dur);
      if (q < 1) {
        const e = easeOut(q);
        const r = p.sr + (p.r - p.sr) * e, c = p.sc + (p.c - p.sc) * e;
        ctx.fillStyle = `rgba(255,120,175,${0.35 + 0.5 * q})`;
        ctx.fillText(RAIN[(p.i + Math.floor(t * 10)) % RAIN.length], c * CW, r * CH);
      } else drawCell(p.r, p.c, 1, t, 1, 0);
    }
  } else if (fill > 0) {
    const r0 = Math.max(0, Math.floor((CY - S * 1.4 * kScale) / CH));
    const r1 = Math.min(ROWS - 1, Math.ceil((CY + S * 1.4 * kScale) / CH));
    const c0 = Math.max(0, Math.floor((CX - S * 1.3 * kScale) / CW));
    const c1 = Math.min(COLS - 1, Math.ceil((CX + S * 1.3 * kScale) / CW));
    for (let r = r0; r <= r1; r++)
      for (let c = c0; c <= c1; c++) drawCell(r, c, kScale, t, fill, beat);
  }

  // outline made of L-O-V-E that ignites from the top dip down to the tip
  if (t > T_OUT) {
    const appear = clamp((t - T_OUT) / 1);
    const reach = clamp((t - T_IGN) / 1.6) * 1.05;
    for (const o of outline) {
      if (t >= T_IGN && o.od <= reach) {
        const fl = 0.5 + 0.5 * Math.sin(t * 4 + o.od * 12);
        ctx.fillStyle = `rgba(255,${Math.round(110 + 60 * fl + 40 * beat)},${Math.round(165 + 30 * fl)},1)`;
      } else ctx.fillStyle = `rgba(130,45,75,${0.55 * appear})`;
      ctx.fillText("LOVE"[(o.c + o.r) % 4], o.c * CW, o.r * CH);
    }
  }

  // header + typewriter text
  ctx.textAlign = 'center';
  if (t > T_SETTLED) {
    ctx.font = `${FS + 1}px "Courier New",monospace`;
    ctx.fillStyle = `rgba(255,190,215,${0.8 * clamp((t - T_SETTLED) / 1)})`;
    ctx.fillText(HEADER, CX, Math.max(14, CY - S * 1.65));
  }
  if (t > T_TEXT) {
    const n = Math.min(MSG.length, Math.floor((t - T_TEXT) * 11));
    const cursor = (Math.floor(t * 2.5) % 2 === 0) ? "_" : " ";
    ctx.font = `bold ${TFS}px "Courier New",monospace`;
    ctx.fillStyle = 'rgba(255,225,235,0.95)';
    ctx.fillText(MSG.slice(0, n) + cursor, CX, CY + S * 1.5);
  }
  if (t > T_END - 3) {
    ctx.font = `${FS}px "Courier New",monospace`;
    ctx.fillStyle = 'rgba(255,150,190,0.45)';
    ctx.fillText("tap to replay", CX, H - CH * 3);
  }

  requestAnimationFrame(frame);
}

addEventListener('resize', setup);
cv.addEventListener('click', () => { start = 0; });
setup();
requestAnimationFrame(frame);
</script>
</body>
</html>
