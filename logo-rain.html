<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo From The Rain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#08050f; --pink:#f3c4dd; --muted:#6d6380; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:Outfit,system-ui,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
  canvas{display:block;width:min(98vw,calc((100vh - 70px) * 16 / 9));aspect-ratio:16/9;background:var(--bg);cursor:pointer}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
  input[type=text]{background:transparent;border:1px solid #3a2f4a;border-radius:999px;color:var(--pink);padding:6px 14px;font:inherit;width:190px;outline:none}
  button{font:inherit;color:var(--pink);background:transparent;border:1px solid #3a2f4a;border-radius:999px;padding:6px 14px;cursor:pointer}
  button:hover,input:focus{border-color:var(--pink)}
  body.drag canvas{outline:2px dashed var(--pink);outline-offset:-6px}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div class="bar">
  <span>Click to replay</span>
  <input id="title" type="text" value="OPEN DAY" maxlength="18" aria-label="Logo text">
  <button id="pick">Use your own logo</button>
  <input id="file" type="file" accept="image/*" hidden>
</div>

<script>
(() => {
// ======================= settings =======================
const W = 1280, H = 720;
let TITLE = "OPEN DAY";
const CAPTION = "Welcome — we're glad you're here";
const GRADIENT = [[255,170,215],[240,175,235],[200,150,250],[150,120,240]];
const MAX_P = 9500;
const T = { noise: 1.2, form: 4.2, hold: 6.5, melt: 3.0 };
const RAIN = 340;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const buf = document.createElement("canvas"); buf.width = W; buf.height = H;
const bctx = buf.getContext("2d");
const img = bctx.createImageData(W, H), px32 = new Uint32Array(img.data.buffer);
const BG32 = (255 << 24) | (15 << 16) | (5 << 8) | 8;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const ease = u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;

// ---- القناع: من نص أو من صورة الشعار
function maskFromText(text){
  const m = document.createElement("canvas"); m.width = W; m.height = H;
  const g = m.getContext("2d");
  let fs = 300; const font = s => `800 ${s}px Outfit, "Arial Black", sans-serif`;
  g.font = font(fs);
  while (g.measureText(text).width > W * 0.82 && fs > 40){ fs *= 0.95; g.font = font(fs); }
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, W / 2, H * 0.43);
  return alphaMask(g);
}
function alphaMask(g){
  const d = g.getImageData(0, 0, W, H).data, a = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) a[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  return a;
}
function maskFromImage(image){
  const m = document.createElement("canvas"); m.width = W; m.height = H;
  const g = m.getContext("2d", { willReadFrequently: true });
  const s = Math.min(W * 0.7 / image.width, H * 0.62 / image.height);
  const iw = image.width * s, ih = image.height * s;
  g.drawImage(image, (W - iw) / 2, H * 0.43 - ih / 2, iw, ih);
  const d = g.getImageData(0, 0, W, H).data, a = new Uint8Array(W * H);
  let transparent = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 30) transparent++;
  if (transparent > W * H * 0.05){ for (let i = 0; i < W * H; i++) a[i] = d[i * 4 + 3] > 110 ? 1 : 0; return a; }
  // صورة بخلفية: نأخذ لون الزاوية كخلفية
  const g2 = document.createElement("canvas").getContext("2d"); g2.canvas.width = 1; g2.canvas.height = 1;
  g2.fillStyle = "#fff"; g2.fillRect(0, 0, 1, 1); g2.drawImage(image, 0, 0, 1, 1, 0, 0, 1, 1);
  const bg = g2.getImageData(0, 0, 1, 1).data;
  for (let i = 0; i < W * H; i++){
    const dr = d[i*4] - bg[0], dg = d[i*4+1] - bg[1], db = d[i*4+2] - bg[2];
    a[i] = d[i*4+3] > 100 && (dr*dr + dg*dg + db*db) > 60 * 60 * 3 / 3 ? 1 : 0;
  }
  // الجزء خارج الصورة يجب ألا يُحتسب
  const x0 = (W - iw) / 2 | 0, y0 = (H * 0.43 - ih / 2) | 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (x < x0 || x > x0 + iw || y < y0 || y > y0 + ih) a[y * W + x] = 0;
  return a;
}

// ---- الجزيئات
let N = 0, tx, ty, cr, cg, cb, x, y, vx, vy, fx, fy, delay, prog, tw, twMax, minY, spanY;
function build(mask){
  let count = 0; for (let i = 0; i < W * H; i++) count += mask[i];
  const p = Math.min(0.9, MAX_P / Math.max(1, count)), pts = [];
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++)
    if (mask[yy * W + xx] && Math.random() < p) pts.push(xx + rand(-.5, .5), yy + rand(-.5, .5));
  N = pts.length / 2;
  const F = n => new Float32Array(n);
  tx = F(N); ty = F(N); cr = F(N); cg = F(N); cb = F(N); x = F(N); y = F(N); vx = F(N); vy = F(N);
  fx = F(N); fy = F(N); delay = F(N); prog = F(N); tw = F(N); twMax = F(N);
  minY = H; let maxY = 0;
  for (let i = 0; i < N; i++){ ty[i] = pts[i*2+1]; minY = Math.min(minY, ty[i]); maxY = Math.max(maxY, ty[i]); }
  spanY = Math.max(1, maxY - minY);
  for (let i = 0; i < N; i++){
    tx[i] = pts[i*2];
    const t = (ty[i] - minY) / spanY * (GRADIENT.length - 1), k = Math.min(GRADIENT.length - 2, t | 0), f = t - k;
    const a = GRADIENT[k], b = GRADIENT[k + 1];
    cr[i] = a[0] + (b[0] - a[0]) * f; cg[i] = a[1] + (b[1] - a[1]) * f; cb[i] = a[2] + (b[2] - a[2]) * f;
    x[i] = rand(W); y[i] = rand(H); vy[i] = rand(1, 4);
  }
  setPhase("noise");
}
let phase = "noise", pt = 0, clock = 0;
function setPhase(p){
  phase = p; pt = 0;
  if (p === "noise") for (let i = 0; i < N; i++){ vy[i] = rand(1, 4); vx[i] = 0; prog[i] = 0; }
  if (p === "form") for (let i = 0; i < N; i++){
    delay[i] = Math.max(0, ((ty[i] - minY) / spanY + rand(-.18, .18)) * 2.6); prog[i] = 0;
  }
  if (p === "melt") for (let i = 0; i < N; i++){ delay[i] = Math.max(0, (1 - (ty[i] - minY) / spanY + rand(-.2, .2)) * 1.4); vx[i] = 0; vy[i] = 0; }
}
function rainStep(i, f){ y[i] += vy[i] * f; x[i] += Math.sin(clock * 1.3 + i) * .15 * f; if (y[i] > H){ y[i] -= H; x[i] = rand(W); } }
function update(dt){
  const f = dt * 60; pt += dt; clock += dt;
  if (phase === "noise"){ for (let i = 0; i < N; i++) rainStep(i, f); if (pt > T.noise) setPhase("form"); }
  else if (phase === "form"){
    for (let i = 0; i < N; i++){
      const u = (pt - delay[i]) / 1.3;
      if (u <= 0){ rainStep(i, f); fx[i] = x[i]; fy[i] = y[i]; continue; }
      const e = ease(Math.min(1, u)); x[i] = fx[i] + (tx[i] - fx[i]) * e; y[i] = fy[i] + (ty[i] - fy[i]) * e; prog[i] = e;
    }
    if (pt > T.form) setPhase("hold");
  } else {
    for (let i = 0; i < N; i++){
      if (phase === "melt" && pt > delay[i]){
        vy[i] += .11 * f; vx[i] += rand(-.08, .08) * f; x[i] += vx[i] * f; y[i] += vy[i] * f;
        prog[i] = Math.max(0, prog[i] - dt * .8);
        if (y[i] > H){ y[i] -= H; x[i] = rand(W); vy[i] = rand(1, 4); vx[i] = 0; }
        continue;
      }
      x[i] = tx[i] + Math.sin(clock * 2 + i * 1.7) * .4; y[i] = ty[i] + Math.cos(clock * 1.7 + i * 2.3) * .4; prog[i] = 1;
    }
    if (phase === "hold" && pt > T.hold) setPhase("melt"); else if (phase === "melt" && pt > T.melt) setPhase("noise");
  }
  for (let k = 0; k < 16 && N; k++){ const i = (Math.random() * N) | 0; tw[i] = twMax[i] = rand(20, 45); }
  for (let i = 0; i < N; i++) if (tw[i] > 0) tw[i] = Math.max(0, tw[i] - f);
}

// ---- مطر الخلفية
const drops = Array.from({ length: RAIN }, () => ({ x: rand(W), y: rand(H), v: rand(8, 15), l: rand(10, 22) }));
function render(){
  px32.fill(BG32);
  for (let i = 0; i < N; i++){
    const xi = x[i] | 0, yi = y[i] | 0; if (xi < 0 || yi < 0 || xi >= W - 1 || yi >= H - 1) continue;
    const p = prog[i]; let b = .5 + .5 * p;
    let r = 150 + (cr[i] - 150) * p, g = 140 + (cg[i] - 140) * p, bl = 175 + (cb[i] - 175) * p;
    if (tw[i] > 0){ const s = Math.sin(Math.PI * tw[i] / twMax[i]); r += (255 - r) * s; g += (255 - g) * s; bl += (255 - bl) * s; b = Math.min(1.25, b + .6 * s); }
    r = Math.min(255, r * b) | 0; g = Math.min(255, g * b) | 0; bl = Math.min(255, bl * b) | 0;
    const c = (255 << 24) | (bl << 16) | (g << 8) | r, o = yi * W + xi;
    px32[o] = c; px32[o + 1] = c; px32[o + W] = c; px32[o + W + 1] = c;
  }
  bctx.putImageData(img, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.filter = "none";
  ctx.drawImage(buf, 0, 0);
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = .5; ctx.filter = "blur(7px)"; ctx.drawImage(buf, 0, 0); ctx.filter = "none";
  ctx.globalAlpha = 1; ctx.strokeStyle = "rgba(205,190,255,.2)"; ctx.lineWidth = 1.2; ctx.beginPath();
  for (const d of drops){ d.y += d.v; d.x -= d.v * .08; if (d.y > H){ d.y = rand(-80, 0); d.x = rand(W + 80); } ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.l * .08, d.y - d.l); }
  ctx.stroke();
  let a = 0; if (phase === "hold") a = Math.min(1, Math.max(0, (pt - .8) / 1.4)); if (phase === "melt") a = Math.max(0, 1 - pt / .8);
  if (a > 0){
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = a;
    ctx.font = '400 34px Outfit, sans-serif'; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(255,170,215,.8)"; ctx.shadowBlur = 16; ctx.fillStyle = "#f6cfe3";
    ctx.fillText(CAPTION, W / 2, H * 0.82); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}
let last = performance.now();
function frame(now){ const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(frame); }

// ---- التحكم
cv.addEventListener("click", () => setPhase("noise"));
const title = document.getElementById("title"), file = document.getElementById("file");
let deb; title.addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(() => { TITLE = title.value.trim() || "OPEN DAY"; build(maskFromText(TITLE)); }, 250); });
document.getElementById("pick").onclick = () => file.click();
function loadFile(f){ if (!f || !f.type.startsWith("image/")) return; const im = new Image(); im.onload = () => { build(maskFromImage(im)); URL.revokeObjectURL(im.src); }; im.src = URL.createObjectURL(f); }
file.onchange = () => loadFile(file.files[0]);
addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drag"); });
addEventListener("dragleave", () => document.body.classList.remove("drag"));
addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drag"); loadFile(e.dataTransfer.files[0]); });

(document.fonts && document.fonts.load ? document.fonts.load('800 100px Outfit') : Promise.resolve()).catch(() => {}).then(() => {
  build(maskFromText(TITLE)); requestAnimationFrame(frame);
});
window.__dbg = { setPhase, get phase(){ return phase; }, get N(){ return N; } };
})();
</script>
</body>
</html>
